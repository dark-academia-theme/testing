name: Harness image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions: {}

env:
  IMAGE_NAME: ghcr.io/dark-academia-theme/theme-harness

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build amd64 image
        run: >-
          docker build
          --platform linux/amd64
          --file container/Containerfile
          --tag theme-harness:validation
          .
      - name: Verify runtime
        run: docker run --rm theme-harness:validation verify-theme-harness-runtime
      - name: Run VHS smoke test
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD",target=/workspaces/testing
          --workdir /workspaces/testing
          theme-harness:validation
          bash tests/smoke.sh
      - name: Test vulnerability gate
        run: bash tests/grype-gate-test.sh
      - name: Scan Hummingbird and language ecosystems
        # anchore/scan-action@v7.4.2
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: theme-harness:validation
          output-format: json
          output-file: grype-hummingbird.json
          fail-build: false
          grype-version: 0.119.0
      - name: Scan Fedora package ecosystem
        # anchore/scan-action@v7.4.2
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        env:
          GRYPE_DISTRO: fedora:43
        with:
          image: theme-harness:validation
          output-format: json
          output-file: grype-fedora.json
          fail-build: false
          grype-version: 0.119.0
      - name: Enforce vulnerability policy
        run: >-
          bash tests/grype-gate.sh
          grype-hummingbird.json
          grype-fedora.json
          tests/grype-exceptions.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # docker/login-action@v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/setup-buildx-action@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: metadata
        # docker/metadata-action@v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: build
        # docker/build-push-action@v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=theme-harness
          cache-to: type=gha,mode=max,scope=theme-harness
      # actions/attest@v4.2.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
